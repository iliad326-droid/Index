<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타이어 재고 조회</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eceff1;--sf:#fff;--ink:#12202b;--mute:#5b6b78;--line:#d5dce1;--ac:#0a6c8f;--aci:#fff;--chip:#e1e8ec;--bad:#b4410f;--ok:#1f7a4d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161b;--sf:#172028;--ink:#e6edf1;--mute:#93a3ae;--line:#2a3741;--ac:#4cb7dc;--aci:#06222d;--chip:#223039;--bad:#ff9b6b;--ok:#6fd5a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161b;--sf:#172028;--ink:#e6edf1;--mute:#93a3ae;--line:#2a3741;--ac:#4cb7dc;--aci:#06222d;--chip:#223039;--bad:#ff9b6b;--ok:#6fd5a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.src{color:var(--mute);font-size:13px;margin-top:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:8px 14px}
button.pri{background:var(--ac);color:var(--aci);border-color:var(--ac);font-weight:500}
button:focus-visible,input:focus-visible,.chip:focus-visible,th[data-k]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.search{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:6px 18px;display:flex;align-items:center;gap:12px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:500 26px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;letter-spacing:.01em;min-width:0;outline:none}
.search input::placeholder{color:var(--mute);font-weight:400;font-size:18px}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.clr{border:0;background:none;color:var(--mute);padding:4px 8px}
.filters{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow b{font-weight:500;color:var(--mute);width:60px;font-size:13px}
select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:240px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px;color:var(--mute);font-size:13px}
.tw{background:var(--sf);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:13px;background:var(--sf);position:sticky;top:0}
th[data-k]{cursor:pointer;user-select:none}
td.r,th.r{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--ac) 7%,var(--sf))}
.dim{font-weight:700;font-size:16px}
td.w{white-space:normal;min-width:180px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}
.tag.rft{color:var(--ac);border-color:var(--ac)}
tr.det td{background:var(--bg);white-space:normal;padding:12px 14px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 18px;margin:0}
.dl div{display:flex;flex-direction:column}.dl dt{font-size:12px;color:var(--mute)}.dl dd{margin:0;word-break:break-all}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.more{display:block;margin:14px auto 0}
dialog{width:min(640px,calc(100vw - 24px));border:1px solid var(--line);border-radius:14px;background:var(--sf);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:18px}
.drop{margin:14px 0;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mute)}
.drop.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.paste{margin:14px 0}.paste label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.paste textarea{display:block;width:100%;box-sizing:border-box;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Consolas,monospace;background:var(--sf);color:var(--ink);white-space:pre;overflow:auto}
.paste .acts{margin-top:8px}
.or{text-align:center;color:var(--mute);font-size:13px;margin:4px 0}
.rep{font-size:14px;margin:10px 0}.rep .bad{color:var(--bad)}.rep .ok{color:var(--ok)}
.rep ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.mode{display:flex;gap:16px;margin:10px 0;flex-wrap:wrap}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#gate[hidden]{display:none}
.gbox{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%);display:grid;gap:12px}
.gbox h2{margin:0;font-size:18px}
.gbox label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.gbox label[hidden]{display:none}
.gbox input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gerr{color:var(--bad);font-size:13px;min-height:18px}
.locked .wrap{display:none}
@media (max-width:600px){.search input{font-size:20px}h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>타이어 재고 조회</h1><div class="src" id="src"></div></div>
<div class="frow"><button id="auth" hidden>접속 계정 설정</button><button id="reset" hidden>기본 데이터로 복원</button><button class="pri" id="up">엑셀 업로드</button></div>
</header>
<label class="search"><input id="q" type="search" autocomplete="off" placeholder="규격(225/45R17), 브랜드, 제품명, 파트번호" aria-label="타이어 검색"><button class="clr" id="clr" hidden type="button" aria-label="검색어 지우기">지우기</button></label>
<div class="filters">
<label class="frow"><b>브랜드</b><select id="fb" aria-label="브랜드 필터"></select></label>
<label class="frow"><b>RFT/STD</b><select id="ft" aria-label="RFT/STD 필터"></select></label>
</div>
<div class="bar"><span id="cnt"></span><span>부품을 누르면 원래 장착 타이어, Model Series, OE Marking이 열립니다</span></div>
<div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table><div id="none" class="empty" hidden>조건에 맞는 타이어가 없습니다. 검색어를 줄이거나 필터를 해제해 보세요.</div></div>
<button class="more" id="more" hidden>더 보기</button>
</div>

<dialog id="dlg">
<h2>엑셀 업로드</h2>
